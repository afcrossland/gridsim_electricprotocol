name: CI

on:
  pull_request:
    branches: [Development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc -b
          npx vitest run

      - name: Build public site and /klute
        run: |
          npm run build:prod
          npm run build:klute

  klute-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the /klute sign-in gate
        working-directory: klute/gate
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q
