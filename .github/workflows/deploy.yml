name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs to write the Pages artifact and mint an id-token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; skip superseded runs rather than queueing them.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc -b
          npx vitest run

      # `npm run build:prod` runs Vite in "prod" mode, which reads .env.prod.
      # The MapTiler key is not in the repo, so it is written here from a
      # repository secret. Note that the key is compiled into the client bundle
      # and is therefore public - restrict it by domain in MapTiler.
      - name: Write build environment
        run: |
          echo "VITE_MAPTILER_KEY=${{ secrets.VITE_MAPTILER_KEY }}" > .env.prod
          echo "VITE_BASE=/${GITHUB_REPOSITORY#*/}/" >> .env.prod

      - run: npm run build:prod

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
