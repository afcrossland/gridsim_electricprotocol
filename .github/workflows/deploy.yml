name: Deploy

# Development -> the dev site (electricfutures-dev.web.app), main -> prod (electricfutures-prod.web.app).
# Each push deploys two things:
# - the public site (splash, /policy/, /deployment/, /calculator/) to Firebase Hosting;
# - the /klute sign-in gate (klute/gate/, with the klute build inside it) to Cloud Run, which
#   Firebase Hosting rewrites /klute/** to (see firebase.json).
# GCP access is keyless, through Workload Identity Federation. The pool, provider, deploy service
# account and every other resource here are in infra/terraform/; GCP only trusts this
# repository's Development branch for dev and main for prod.
on:
  push:
    branches: [Development, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

# Never let two deploys of the same environment race; skip superseded runs.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # GitHub environments "dev" and "prod" each hold their own variables/secrets (see README).
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc -b
          npx vitest run

      # `npm run build:prod` runs Vite in "prod" mode, which reads .env.prod. The MapTiler key is
      # compiled into the client bundle and is therefore public - restrict it by domain in MapTiler.
      # Nothing else secret goes into this build: /klute is built into the gate's image instead.
      - name: Build public site
        run: |
          echo "VITE_MAPTILER_KEY=${{ secrets.VITE_MAPTILER_KEY }}" > .env.prod
          npm run build:prod

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the /klute gate image
        run: |
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/electricfutures-repo-$ENV/klute-gate:${GITHUB_SHA::7}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f klute/gate/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Only the image changes here; the service's settings (env, secrets, scaling) are owned by
      # Terraform, which ignores the image so the two don't fight.
      - name: Deploy the /klute gate
        run: gcloud run deploy "klute-gate-$ENV" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" --quiet

      - name: Deploy the public site
        run: npx --yes firebase-tools@15.24.0 deploy --only "hosting:electricfutures-$ENV" --project "$PROJECT_ID" --non-interactive
