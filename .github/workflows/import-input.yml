name: Import policy spreadsheets

# Runs when a spreadsheet in input/ is added or changed on Development (for example uploaded through the GitHub website - pick Development as the branch when uploading unless it is the default).
# It re-reads every sheet in input/, rewrites the policy data in src/data/, commits that, brings the dev policy database
# into step with it, and publishes the site.
# If a sheet cannot be read the run fails, commits nothing, and the report below says what to fix.
on:
  push:
    branches: [Development]
    paths:
      - "input/*.xlsx"
      - "scripts/import_output_sheets.py"
  workflow_dispatch:

permissions:
  contents: write # commit the regenerated data
  actions: write # start the site deploy afterwards
  id-token: write # Workload Identity Federation, for the dev policy database

# One import at a time; a second upload waits for the first rather than racing it.
concurrency:
  group: import-input
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Identifiers, not secrets (see deploy.yml). This workflow only runs for Development, so only dev's database is
    # updated; the github-ef-dev pool only trusts that branch, and ef-import-dev can reach that database and nothing else.
    env:
      PROJECT_ID: project-08077ad6-f39e-4a3c-b19
      PROJECT_NUMBER: "605425219883"
      CLOUDSQL_INSTANCE: project-08077ad6-f39e-4a3c-b19:us-central1:gridsim-dev-db
      CLOUD_SQL_PROXY_VERSION: v2.26.2
      CLOUD_SQL_PROXY_SHA256: 787d23b4b396186f307b6b274c94099d25b15a81b7e60c91ceed18c07558e9d7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install openpyxl -r klute/gate/requirements.txt

      - name: Import the spreadsheets
        run: |
          set -o pipefail
          python3 scripts/import_output_sheets.py | tee import-report.txt

      # Shown on the run's summary page whether the import worked or not, so the uploader can read it in plain text.
      - name: Show the import report
        if: always()
        run: |
          {
            echo "## Spreadsheet import"
            echo
            echo '```'
            cat import-report.txt 2>/dev/null || echo "The import did not run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the updated data
        id: commit
        run: |
          if git diff --quiet -- src/data; then
            echo "The spreadsheets give the same data as before - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data
          git commit -m "Update policy data from the input spreadsheets"
          git pull --rebase origin Development
          git push origin HEAD:Development
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The dev Policy Explorer reads its data from the policy database (ROADMAP.md Phase 1), so it is brought into step
      # with src/data on every run - including runs that changed nothing, which repairs any drift. Done after the push,
      # so the database is never ahead of git, and before the deploy, so the site and the database change together.
      - uses: google-github-actions/auth@v3
        if: github.ref == 'refs/heads/Development'
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-ef-dev/providers/github
          service_account: ef-import-dev@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v3
        if: github.ref == 'refs/heads/Development'

      - name: Update the dev policy database
        if: github.ref == 'refs/heads/Development'
        run: |
          set -euo pipefail
          curl -sSfL -o cloud-sql-proxy \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/$CLOUD_SQL_PROXY_VERSION/cloud-sql-proxy.linux.amd64"
          echo "$CLOUD_SQL_PROXY_SHA256  cloud-sql-proxy" | sha256sum -c -
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --address 127.0.0.1 --port 5432 "$CLOUDSQL_INSTANCE" > proxy.log 2>&1 &
          for _ in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break; sleep 1; done

          # The secret holds the Cloud Run (socket) form of the URL; point it at the proxy instead. Masked first, so
          # neither the URL nor its password can reach the log.
          url="$(gcloud secrets versions access latest --secret electricfutures-dev-database-url --project "$PROJECT_ID")"
          echo "::add-mask::$url"
          echo "::add-mask::$(python3 -c 'import sys; from urllib.parse import urlsplit; print(urlsplit(sys.argv[1]).password)' "$url")"
          DATABASE_URL="$(printf '%s' "$url" | sed -E 's#@/([^?]+)\?host=.*$#@127.0.0.1:5432/\1#')"
          export DATABASE_URL

          cd klute/gate
          # Only the imported research is replaced. Editors change questions, sections and answers in the app (ROADMAP.md
          # Phase 4), so --overwrite-structure would throw their work away, and only the research is checked against
          # the files. A question the spreadsheets change has to be changed in the admin console too.
          python -m ep_db.import_json --actor "import-input.yml run ${{ github.run_id }}" | tee ../../db-report.txt
          python -m ep_db.import_json --check --research-only | tee -a ../../db-report.txt

      - name: Show the database report
        if: always() && github.ref == 'refs/heads/Development'
        run: |
          {
            echo "## Dev policy database"
            echo
            echo '```'
            cat db-report.txt 2>/dev/null || echo "The database was not updated - see the step's log. The site's JSON is already committed."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Still published if the database update failed: the JSON is committed either way, and the run stays red.
      - name: Publish the site
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A push made with the built-in token does not start other workflows, so start the site deploy directly.
        run: gh workflow run deploy.yml --ref Development
