<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Policy Explorer</title>
    <script>
      // Pick the loading shell's colours before first paint: the same stored choice the app makes
      // (shared/lib/darkMode.ts), else the device's.
      try {
        var stored = localStorage.getItem("gsc-dark-mode");
        var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.shell = dark ? "dark" : "light";
      } catch (e) {}
    </script>
    <style>
      /* The page is blank until the policy data has arrived and the app has loaded (src/main.tsx);
         this stands in for it. React replaces everything inside #root when it first renders. */
      html { background: #f4f1e9; }
      html[data-shell="dark"] { background: #171d1e; }
      .shell {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: "Eastman Grotesque", -apple-system, BlinkMacSystemFont, sans-serif;
        color: #3b3838;
      }
      html[data-shell="dark"] .shell { color: #f4f1e9; }
      .shell img { width: 34px; height: 34px; }
      .shell h1 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -0.01em; }
      .shell p { margin: 0; font-size: 0.875rem; opacity: 0.7; }
      .shell .bar { width: 120px; height: 3px; border-radius: 2px; background: rgba(0, 171, 187, 0.2); overflow: hidden; }
      .shell .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #00abbb;
        animation: shell-slide 1.1s ease-in-out infinite;
      }
      @keyframes shell-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .shell .bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="shell" role="status" aria-live="polite">
        <img src="/favicon.png" alt="" />
        <h1>Solar Policy Explorer</h1>
        <div class="bar" aria-hidden="true"></div>
        <p>Loading policy data…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
